            <g transform="translate(1.6, 1.6)">
              <path d="M 41 72 L 83 72 L 80 116 L 44 116 Z" fill="#D29B6E"/>
            </g>
            <path d="M 82 81 C 95 81 95 104 81 104" fill="none" stroke="#1F1F23" stroke-width="3.5"/>
            <path d="M 41 72 L 83 72 L 80 116 L 44 116 Z" fill="none" stroke="#1F1F23" stroke-width="3.4"/>
            <ellipse cx="62" cy="72" rx="21" ry="5.5" fill="#DFC5A7" stroke="#1F1F23" stroke-width="2.9"/>
            <ellipse cx="62" cy="72.4" rx="15" ry="3.2" fill="#3E271C"/>
            <path d="M 55 88 L 57 94 M 61 89 L 63 95" stroke="#1F1F23" stroke-width="1.9"/>

