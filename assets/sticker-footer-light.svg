            <path d="M 72 64 Q 78 52 96 42 Q 106 34 102 22" fill="none" stroke="#1F1F23" stroke-width="2.3"/>
            <path d="M 80 65 Q 89 56 105 49 Q 112 43 111 33" fill="none" stroke="#1F1F23" stroke-width="2.0"/>
