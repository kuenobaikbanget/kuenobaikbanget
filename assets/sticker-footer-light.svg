              <path d="M 24 44 L 20 14 L 42 26 C 52 23 68 23 78 26 L 100 14 L 96 44 C 106 58 103 82 93 93 L 96 113 L 24 113 L 27 93 C 17 82 14 58 24 44 Z" fill="#2B2A30"/>
            </g>
            <path d="M 24 44 L 20 14 L 42 26 C 52 23 68 23 78 26 L 100 14 L 96 44 C 106 58 103 82 93 93 L 96 113 L 24 113 L 27 93 C 17 82 14 58 24 44 Z" fill="none" stroke="#1F1F23" stroke-width="3.6"/>
            <path d="M 27 39 L 25 22 L 38 29 Z" fill="#EAC0C8"/>
            <path d="M 93 39 L 95 22 L 82 29 Z" fill="#EAC0C8"/>

            <!-- Inverted-V cream muzzle (visible above mug rim) -->
            <path d="M 24 63 C 34 57 49 54 55 47 C 58 44 62 44 65 47 C 71 54 86 57 96 63 C 93 74 82 82 60 82 C 38 82 27 74 24 63 Z"
                  fill="#F7F3EA"/>
            <path d="M 46 31 Q 60 27 74 31" fill="none" stroke="#44424C" stroke-width="3"/>

            <!-- Sleepy happy curved eyes -->
            <path d="M 33 46 Q 40 39 47 46" fill="none" stroke="#F7F3EA" stroke-width="3.1"/>
            <path d="M 73 46 Q 80 39 87 46" fill="none" stroke="#F7F3EA" stroke-width="3.1"/>
            <polygon points="56,57 64,57 60,61" fill="#E5B0C5"/>
            <path d="M 53 64 Q 56.5 67.5 60 63 Q 63.5 67.5 67 64" fill="none" stroke="#1F1F23" stroke-width="2.2"/>

