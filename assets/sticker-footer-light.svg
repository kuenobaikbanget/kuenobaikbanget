            <path d="M 41 85 L 38 89 M 42 91 L 38 93" stroke="#1F1F23" stroke-width="1.7"/>

            <path d="M 98 86 C 98 79 86 78 76 83 C 70 86 70 96 78 97 C 87 98 98 94 98 86 Z"
