<svg xmlns="http://www.w3.org/2000/svg" width="154" height="136" viewBox="0 0 154 136" role="img" aria-labelledby="sfl_title sfl_desc">
  <title id="sfl_title">Chill tuxedo cat holding coffee mug sticker</title>
  <desc id="sfl_desc">Casual pastel die-cut sticker of a sleepy tuxedo cat holding a coffee mug at the bottom of the notebook.</desc>
  <g transform="translate(16, 12) rotate(-3) scale(0.96)">
          <g transform="translate(3,4)" fill="rgba(31,31,35,0.10)" stroke="rgba(31,31,35,0.10)" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"><path d="M 24 44 L 20 14 L 42 26 C 52 23 68 23 78 26 L 100 14 L 96 44 C 106 58 103 82 93 93 L 96 113 L 24 113 L 27 93 C 17 82 14 58 24 44 Z"/><path d="M 41 72 L 83 72 L 80 116 L 44 116 Z"/><path d="M 82 81 C 95 81 95 104 81 104" fill="none"/></g>
          <g transform="translate(0,0)" fill="#D3E3D3" stroke="#D3E3D3" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"><path d="M 24 44 L 20 14 L 42 26 C 52 23 68 23 78 26 L 100 14 L 96 44 C 106 58 103 82 93 93 L 96 113 L 24 113 L 27 93 C 17 82 14 58 24 44 Z"/><path d="M 41 72 L 83 72 L 80 116 L 44 116 Z"/><path d="M 82 81 C 95 81 95 104 81 104" fill="none"/></g>
          <g stroke-linecap="round" stroke-linejoin="round">
