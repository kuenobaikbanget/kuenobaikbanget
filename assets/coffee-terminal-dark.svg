<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" role="img" aria-labelledby="ctd_title ctd_desc">
  <title id="ctd_title">Hand-drawn CoffeeFetch Terminal</title>
  <desc id="ctd_desc">Hand-drawn fastfetch-style terminal inspired by CachyOS with OS/kernel puns, Fore Coffee Berry Manuka Americano order, and iced coffee doodle.</desc>
  <defs>
    <pattern id="ctd_dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.85" fill="#2A2A34"/>
    </pattern>
  </defs>

  <!-- Offset paper shadow -->
  <g transform="translate(4.5, 5.5)">
    <path d="M 20 18 C 230 15 610 20 820 17 C 829 17 832 24 832 33 C 834 138 830 248 832 338 C 832 347 825 352 816 352 C 596 355 240 350 22 353 C 13 353 10 345 10 336 C 8 232 12 124 10 29 C 10 21 14 18 20 18 Z" fill="#0A0B0E"/>
  </g>

  <!-- Main hand-drawn terminal window -->
  <path d="M 20 18 C 230 15 610 20 820 17 C 829 17 832 24 832 33 C 834 138 830 248 832 338 C 832 347 825 352 816 352 C 596 355 240 350 22 353 C 13 353 10 345 10 336 C 8 232 12 124 10 29 C 10 21 14 18 20 18 Z" fill="#1B1B20"/>
  <path d="M 20 18 C 230 15 610 20 820 17 C 829 17 832 24 832 33 C 834 138 830 248 832 338 C 832 347 825 352 816 352 C 596 355 240 350 22 353 C 13 353 10 345 10 336 C 8 232 12 124 10 29 C 10 21 14 18 20 18 Z" fill="url(#ctd_dots)"/>
  <path d="M 20 18 C 230 15 610 20 820 17 C 829 17 832 24 832 33 L 832 54 Q 620 52 420 55 T 10 53 L 10 29 C 10 21 14 18 20 18 Z" fill="#23232A"/>
  <path d="M 20 18 C 230 15 610 20 820 17 C 829 17 832 24 832 33 C 834 138 830 248 832 338 C 832 347 825 352 816 352 C 596 355 240 350 22 353 C 13 353 10 345 10 336 C 8 232 12 124 10 29 C 10 21 14 18 20 18 Z" fill="none" stroke="#E6E0D4" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 11 53 Q 210 50 420 54 T 831 52" fill="none" stroke="#E6E0D4" stroke-width="1.9" stroke-linecap="round"/>

  <!-- Two kraft masking tape strips on top corners -->
  <g transform="translate(116, 5) rotate(-4)">
    <rect x="0" y="0" width="54" height="16" rx="2" fill="#4A4338" opacity="0.92" stroke="#5F5648" stroke-width="1.3"/>
  </g>
  <g transform="translate(664, 4) rotate(5)">
    <rect x="0" y="0" width="54" height="16" rx="2" fill="#4A4338" opacity="0.92" stroke="#5F5648" stroke-width="1.3"/>
  </g>

  <!-- Hand-drawn pastel window buttons -->
  <circle cx="34" cy="36" r="5.6" fill="#EED2DF" stroke="#1F1F23" stroke-width="1.7"/>
  <circle cx="53" cy="36.5" r="5.5" fill="#F3E6A2" stroke="#1F1F23" stroke-width="1.7"/>
  <circle cx="72" cy="35.8" r="5.6" fill="#D3E3D3" stroke="#1F1F23" stroke-width="1.7"/>

  <text x="420" y="40.5" text-anchor="middle" fill="#D6CFC4" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.8" font-weight="700">coffeefetch  ~  akbar@catnap-os</text>

  <!-- Command line -->
  <text x="30" y="80" fill="#D3E3D3" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700">~ &gt;</text>
  <text x="64" y="80" fill="#F7F3EA" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700">coffeefetch --order fore</text>

  <!-- Left: Hand-drawn CachyOS-inspired mascot logo -->
  
      <g transform="translate(36, 98)" stroke-linecap="round" stroke-linejoin="round">
        <!-- Subtle floating motion on the quirky OS mascot logo -->
        <animateTransform attributeName="transform" type="translate" values="36,98; 36,93; 36,98" dur="4.8s" repeatCount="indefinite"/>
        <!-- Tiny quirky cat ears on top of the C -->
        <path d="M 48 34 L 44 15 L 63 29 Z" fill="#9ED8C2" stroke="#1F1F23" stroke-width="3.0"/>
        <path d="M 49 30 L 47 20 L 57 28 Z" fill="#EAC0C8"/>
        <path d="M 88 33 L 102 15 L 104 33 Z" fill="#9ED8C2" stroke="#1F1F23" stroke-width="3.0"/>
        <path d="M 93 30 L 100 21 L 101 30 Z" fill="#EAC0C8"/>

        <!-- Offset riso fill for CachyOS-inspired C -->
        <g transform="translate(2.5, 2.5)">
          <path d="M 118 32 L 58 32 C 44 32 36 40 30 50 L 12 84 C 7 94 7 104 12 114 L 30 148 C 36 158 45 164 58 164 L 122 164 C 130 164 134 156 130 148 L 120 132 C 117 128 112 126 105 126 L 64 126 C 58 126 54 122 51 116 L 44 102 C 42 98 42 94 44 90 L 51 76 C 54 70 58 66 64 66 L 108 66 C 115 66 120 62 123 56 L 130 42 C 133 36 127 32 118 32 Z" fill="#9ED8C2"/>
          <path d="M 32 138 L 58 164 L 122 164 L 128 152 L 62 126 L 44 102 Z" fill="#CFE0F2" opacity="0.65"/>
        </g>
        <!-- Crisp hand-drawn outline -->
        <path d="M 118 32 L 58 32 C 44 32 36 40 30 50 L 12 84 C 7 94 7 104 12 114 L 30 148 C 36 158 45 164 58 164 L 122 164 C 130 164 134 156 130 148 L 120 132 C 117 128 112 126 105 126 L 64 126 C 58 126 54 122 51 116 L 44 102 C 42 98 42 94 44 90 L 51 76 C 54 70 58 66 64 66 L 108 66 C 115 66 120 62 123 56 L 130 42 C 133 36 127 32 118 32 Z" fill="none" stroke="#1F1F23" stroke-width="3.4"/>
        <!-- Sketchy hatch marks -->
        <path d="M 24 94 L 30 96 M 24 102 L 30 104 M 72 146 L 78 152 M 82 146 L 88 152" stroke="#1F1F23" stroke-width="1.8" opacity="0.7"/>

        <!-- Goofy Nichijou/Cuervitos face right on the C cheek -->
        <circle cx="29" cy="84" r="5.4" fill="#FFFFFF" stroke="#1F1F23" stroke-width="2.2"/>
        <circle cx="30.5" cy="84" r="2.0" fill="#1F1F23"/>
        <circle cx="48" cy="84" r="5.4" fill="#FFFFFF" stroke="#1F1F23" stroke-width="2.2"/>
        <circle cx="49.5" cy="84" r="2.0" fill="#1F1F23"/>
        <path d="M 35 94 Q 38.5 97.5 42 93" fill="none" stroke="#1F1F23" stroke-width="2.0"/>

        <!-- 3 floating CachyOS-style quirky bubbles (gently bobbing) -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="3.8s" repeatCount="indefinite"/>
          <circle cx="152" cy="58" r="10.5" fill="#F3E6A2" stroke="#1F1F23" stroke-width="2.6"/>
          <circle cx="149" cy="55" r="2" fill="#FFFFFF"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,5; 0,0" dur="4.4s" repeatCount="indefinite"/>
          <circle cx="134" cy="96" r="14" fill="#EED2DF" stroke="#1F1F23" stroke-width="2.8"/>
          <path d="M 129 94 Q 134 99 139 94" fill="none" stroke="#1F1F23" stroke-width="1.8"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="5.1s" repeatCount="indefinite"/>
          <circle cx="170" cy="128" r="16.5" fill="#DDD2EA" stroke="#1F1F23" stroke-width="2.9"/>
          <!-- Mini coffee bean mark inside biggest bubble -->
          <ellipse cx="170" cy="128" rx="6.5" ry="4.5" fill="#D29B6E" stroke="#1F1F23" stroke-width="1.6" transform="rotate(-18 170 128)"/>
          <path d="M 166 127 Q 170 130 174 127" fill="none" stroke="#1F1F23" stroke-width="1.4"/>
        </g>

        <text x="92" y="196" text-anchor="middle" fill="#A7A196" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" font-weight="600">catnap-os</text>
      </g>

  <!-- Middle Box 1: Coffee Order (fastfetch framed style) -->
  <path d="M 272 96 L 406 96 M 526 96 L 656 96 L 656 102 M 272 96 L 272 102" fill="none" stroke="#4A4A58" stroke-width="1.4" stroke-linecap="round"/>
  <text x="466" y="100" text-anchor="middle" fill="#A7A196" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600">Coffee Order</text>
  <path d="M 272 196 L 272 202 L 656 202 L 656 196" fill="none" stroke="#4A4A58" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Subtle pastel highlighter behind Fore Coffee & Berry Manuka Americano -->
  <g transform="rotate(0.4 426 113)">
    <rect x="378" y="104" width="94" height="16" rx="4" fill="#4A4123"/>
  </g>
  <g transform="rotate(-0.4 470 132)">
    <rect x="378" y="123" width="182" height="17" rx="4" fill="#4E2B39"/>
  </g>

  <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.2">
    <text x="282" y="117" fill="#D3E3D3" font-weight="700">Cafe</text>
    <text x="364" y="117" fill="#A7A196">:</text>
    <text x="382" y="117" fill="#F0ECE2" font-weight="700">Fore Coffee</text>

    <text x="282" y="136" fill="#EED2DF" font-weight="700">├─ Brew</text>
    <text x="364" y="136" fill="#A7A196">:</text>
    <text x="382" y="136" fill="#F0ECE2" font-weight="700">Berry Manuka Americano</text>

    <text x="282" y="155" fill="#F3E6A2" font-weight="700">├─ Sugar</text>
    <text x="364" y="155" fill="#A7A196">:</text>
    <text x="382" y="155" fill="#F0ECE2">less sugar</text>

    <text x="282" y="174" fill="#CFE0F2" font-weight="700">├─ Ice</text>
    <text x="364" y="174" fill="#A7A196">:</text>
    <text x="382" y="174" fill="#F0ECE2">normal ice</text>

    <text x="282" y="193" fill="#D3E3D3" font-weight="700">└─ Fuel</text>
    <text x="364" y="193" fill="#A7A196">:</text>
    <text x="382" y="193" fill="#F0ECE2">100% chilled &amp; ready to sip</text>
  </g>

  <!-- Middle Box 2: Funny System Puns -->
  <path d="M 272 218 L 400 218 M 532 218 L 656 218 L 656 224 M 272 218 L 272 224" fill="none" stroke="#4A4A58" stroke-width="1.4" stroke-linecap="round"/>
  <text x="466" y="222" text-anchor="middle" fill="#A7A196" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600">System / Vibes</text>
  <path d="M 272 294 L 272 300 L 656 300 L 656 294" fill="none" stroke="#4A4A58" stroke-width="1.4" stroke-linecap="round"/>

  <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.2">
    <text x="282" y="239" fill="#F3E6A2" font-weight="700">OS</text>
    <text x="364" y="239" fill="#A7A196">:</text>
    <text x="382" y="239" fill="#F0ECE2">CatNapOS x86_64</text>

    <text x="282" y="258" fill="#CFE0F2" font-weight="700">├─ Krnl</text>
    <text x="364" y="258" fill="#A7A196">:</text>
    <text x="382" y="258" fill="#F0ECE2">7.3.0-sloth-rt</text>

    <text x="282" y="277" fill="#EED2DF" font-weight="700">├─ Pets</text>
    <text x="364" y="277" fill="#A7A196">:</text>
    <text x="382" y="277" fill="#F0ECE2">cimol, cola</text>

    <text x="282" y="295" fill="#D3E3D3" font-weight="700">└─ Sh</text>
    <text x="364" y="295" fill="#A7A196">:</text>
    <text x="382" y="295" fill="#F0ECE2">fish 4.9.3</text>
  </g>

  <!-- Right: Iced Berry Manuka Americano cup doodle -->
  
      <g transform="translate(682, 118) rotate(3) scale(0.98)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 28 34 L 94 34 L 84 126 Q 61 132 38 126 Z" fill="#2B2936" stroke="#2B2936" stroke-width="14"/>
        <path d="M 67 34 L 76 6 L 91 3" fill="none" stroke="#E5B0C5" stroke-width="5"/>
        <path d="M 67 34 L 76 6 L 91 3" fill="none" stroke="#1F1F23" stroke-width="2.1"/>
        <g transform="translate(1.5, 1.5)">
          <path d="M 30 36 L 92 36 L 83 124 Q 61 130 39 124 Z" fill="#F7F3EA"/>
          <path d="M 32 48 L 90 48 L 86 92 L 36 92 Z" fill="#5A3A28"/>
          <path d="M 36 90 Q 61 95 86 90 L 84 106 Q 61 111 38 106 Z" fill="#E6B85C"/>
          <path d="M 38 104 Q 61 109 84 104 L 83 124 Q 61 130 39 124 Z" fill="#B84B68"/>
        </g>
        <rect x="42" y="54" width="12" height="11" rx="2.5" fill="#FFFFFF" fill-opacity="0.72" stroke="#1F1F23" stroke-width="1.6" transform="rotate(-10 48 59)"/>
        <rect x="64" y="52" width="12" height="11" rx="2.5" fill="#FFFFFF" fill-opacity="0.72" stroke="#1F1F23" stroke-width="1.6" transform="rotate(14 70 57)"/>
        <rect x="52" y="68" width="11" height="10" rx="2.5" fill="#FFFFFF" fill-opacity="0.65" stroke="#1F1F23" stroke-width="1.5" transform="rotate(6 57 73)"/>
        <path d="M 30 36 L 92 36 L 83 124 Q 61 130 39 124 Z" fill="none" stroke="#1F1F23" stroke-width="3.0"/>
        <path d="M 27 36 C 32 20 90 20 95 36 Z" fill="#F7F3EA" fill-opacity="0.75" stroke="#1F1F23" stroke-width="2.7"/>
        <ellipse cx="61" cy="36" rx="34" ry="4.6" fill="#F7F3EA" stroke="#1F1F23" stroke-width="2.5"/>
        <circle cx="48" cy="115" r="3.2" fill="#8C2845" stroke="#1F1F23" stroke-width="1.3"/>
        <circle cx="57" cy="118" r="2.8" fill="#8C2845" stroke="#1F1F23" stroke-width="1.3"/>
        <circle cx="71" cy="115" r="3.0" fill="#8C2845" stroke="#1F1F23" stroke-width="1.3"/>
        <g transform="translate(106, 46)">
          <path d="M 0 -7 L 1.7 -1.7 L 7 0 L 1.7 1.7 L 0 7 L -1.7 1.7 L -7 0 L -1.7 -1.7 Z" fill="#F3E6A2" stroke="#1F1F23" stroke-width="1.3">
            <animateTransform attributeName="transform" type="rotate" values="-12; 14; -12" dur="4.4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.65;1;0.65" dur="3.6s" repeatCount="indefinite"/>
          </path>
        </g>
        <text x="61" y="148" text-anchor="middle" fill="#A7A196" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" font-weight="600" transform="rotate(-2 61 148)">fore · iced</text>
      </g>

  <!-- Fastfetch pastel color palette dots -->
  <circle cx="288" cy="316" r="5.2" fill="#F2ECE0" stroke="#1F1F23" stroke-width="1.4"/><circle cx="308" cy="316" r="5.2" fill="#EED2DF" stroke="#1F1F23" stroke-width="1.4"/><circle cx="328" cy="316" r="5.2" fill="#DDD2EA" stroke="#1F1F23" stroke-width="1.4"/><circle cx="348" cy="316" r="5.2" fill="#CFE0F2" stroke="#1F1F23" stroke-width="1.4"/><circle cx="368" cy="316" r="5.2" fill="#D3E3D3" stroke="#1F1F23" stroke-width="1.4"/><circle cx="388" cy="316" r="5.2" fill="#F3E6A2" stroke="#1F1F23" stroke-width="1.4"/><circle cx="408" cy="316" r="5.2" fill="#D29B6E" stroke="#1F1F23" stroke-width="1.4"/>

  <!-- Bottom prompt with blinking cursor -->
  <text x="30" y="336" fill="#D3E3D3" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700">&gt;</text>
  <rect x="46" y="324" width="8.5" height="14" rx="2" fill="#F2ECE0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>