<svg xmlns="http://www.w3.org/2000/svg" width="840" height="246" viewBox="0 0 840 246" role="img" aria-labelledby="ctl_title ctl_desc">
  <title id="ctl_title">Hand-drawn Coffee Order Terminal</title>
  <desc id="ctl_desc">Hand-drawn sketchy terminal showing Akbar's Fore Coffee order: Berry Manuka Americano, less sugar, normal ice.</desc>
  <defs>
    <pattern id="ctl_dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.85" fill="#E1DAC9"/>
    </pattern>
  </defs>

  <!-- Offset paper shadow -->
  <g transform="translate(4.5, 5.5)">
    <path d="M 20 18 C 230 15 610 20 820 17 C 829 17 832 24 832 33 C 834 98 830 164 832 224 C 832 233 825 238 816 238 C 596 241 240 236 22 239 C 13 239 10 231 10 222 C 8 156 12 90 10 29 C 10 21 14 18 20 18 Z" fill="#E4DDD0"/>
  </g>

  <!-- Main hand-drawn terminal window -->
  <path d="M 20 18 C 230 15 610 20 820 17 C 829 17 832 24 832 33 C 834 98 830 164 832 224 C 832 233 825 238 816 238 C 596 241 240 236 22 239 C 13 239 10 231 10 222 C 8 156 12 90 10 29 C 10 21 14 18 20 18 Z" fill="#FBF8F1"/>
  <path d="M 20 18 C 230 15 610 20 820 17 C 829 17 832 24 832 33 C 834 98 830 164 832 224 C 832 233 825 238 816 238 C 596 241 240 236 22 239 C 13 239 10 231 10 222 C 8 156 12 90 10 29 C 10 21 14 18 20 18 Z" fill="url(#ctl_dots)"/>
  <path d="M 20 18 C 230 15 610 20 820 17 C 829 17 832 24 832 33 L 832 54 Q 620 52 420 55 T 10 53 L 10 29 C 10 21 14 18 20 18 Z" fill="#F2ECE0"/>
  <path d="M 20 18 C 230 15 610 20 820 17 C 829 17 832 24 832 33 C 834 98 830 164 832 224 C 832 233 825 238 816 238 C 596 241 240 236 22 239 C 13 239 10 231 10 222 C 8 156 12 90 10 29 C 10 21 14 18 20 18 Z" fill="none" stroke="#1F1F23" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 11 53 Q 210 50 420 54 T 831 52" fill="none" stroke="#1F1F23" stroke-width="1.9" stroke-linecap="round"/>

  <!-- Two kraft masking tape strips on top corners -->
  <g transform="translate(116, 5) rotate(-4)">
    <rect x="0" y="0" width="54" height="16" rx="2" fill="#E8DEC6" opacity="0.92" stroke="#CFC3A6" stroke-width="1.3"/>
  </g>
  <g transform="translate(664, 4) rotate(5)">
    <rect x="0" y="0" width="54" height="16" rx="2" fill="#E8DEC6" opacity="0.92" stroke="#CFC3A6" stroke-width="1.3"/>
  </g>

  <!-- Hand-drawn pastel window buttons -->
  <circle cx="34" cy="36" r="5.6" fill="#EED2DF" stroke="#1F1F23" stroke-width="1.7"/>
  <circle cx="53" cy="36.5" r="5.5" fill="#F3E6A2" stroke="#1F1F23" stroke-width="1.7"/>
  <circle cx="72" cy="35.8" r="5.6" fill="#D3E3D3" stroke="#1F1F23" stroke-width="1.7"/>

  <text x="420" y="40.5" text-anchor="middle" fill="#4E4A43" font-family="'Comic Sans MS', 'Chalkboard SE', 'Bradley Hand', 'Segoe Print', cursive" font-size="13.5" font-weight="700" letter-spacing="0.3">coffee-order.sh  ~  fore coffee</text>

  <!-- Hand-drawn highlighter swipes behind key terms (aligned to monospace metrics) -->
  <g transform="rotate(-0.8 221 82)">
    <rect x="164" y="70" width="114" height="22" rx="5" fill="#F3E6A2"/>
  </g>
  <g transform="rotate(0.5 224 126)">
    <rect x="112" y="114" width="222" height="22" rx="5" fill="#EED2DF"/>
  </g>

  <!-- Terminal command + sketchy order lines -->
  <text x="34" y="86" fill="#5A7D5A" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="700">$</text>
  <text x="50" y="86" fill="#1F1F23" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="700">order --shop "Fore Coffee" --for akbar</text>

  <path d="M 34 102 Q 190 99 345 103 T 618 101" fill="none" stroke="#C5BEB0" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round"/>

  <text x="46" y="131" fill="#6E685E" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.2" font-weight="600">item  :</text>
  <text x="118" y="131" fill="#1F1F23" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="14.2" font-weight="700">Berry Manuka Americano</text>

  <!-- Hand-drawn margin callout arrow pointing to Berry Manuka Americano -->
  <path d="M 354 126 C 392 120 420 124 448 134" fill="none" stroke="#6E685E" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M 358 121 L 351 126 L 359 130" fill="none" stroke="#6E685E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="456" y="139" fill="#6E685E" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-style="italic" transform="rotate(2 456 139)">go-to order</text>

  <text x="46" y="159" fill="#6E685E" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.2" font-weight="600">sugar :</text>
  <text x="118" y="159" fill="#1F1F23" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.8" font-weight="700">less sugar</text>

  <text x="46" y="185" fill="#6E685E" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.2" font-weight="600">ice   :</text>
  <text x="118" y="185" fill="#1F1F23" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.8" font-weight="700">normal ice</text>

  <!-- Status line + blinking hand-drawn cursor -->
  <text x="34" y="217" fill="#3D6085" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.2" font-weight="700">&gt; status:</text>
  <text x="116" y="217" fill="#1F1F23" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="700">chilled &amp; ready to sip</text>
  <rect x="304" y="205" width="8.5" height="14" rx="2" fill="#1F1F23">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  
      <g transform="translate(668, 74) rotate(3)" stroke-linecap="round" stroke-linejoin="round">
        <!-- Soft sticker backing glow -->
        <path d="M 28 34 L 94 34 L 84 126 Q 61 132 38 126 Z" fill="#DDD2EA" stroke="#DDD2EA" stroke-width="14"/>
        <!-- Straw -->
        <path d="M 67 34 L 76 6 L 91 3" fill="none" stroke="#E5B0C5" stroke-width="5"/>
        <path d="M 67 34 L 76 6 L 91 3" fill="none" stroke="#1F1F23" stroke-width="2.1"/>
        <!-- Cup liquid layers (offset riso fills) -->
        <g transform="translate(1.5, 1.5)">
          <path d="M 30 36 L 92 36 L 83 124 Q 61 130 39 124 Z" fill="#F7F3EA"/>
          <!-- Espresso top -->
          <path d="M 32 48 L 90 48 L 86 92 L 36 92 Z" fill="#5A3A28"/>
          <!-- Manuka honey golden band -->
          <path d="M 36 90 Q 61 95 86 90 L 84 106 Q 61 111 38 106 Z" fill="#E6B85C"/>
          <!-- Berry puree bottom -->
          <path d="M 38 104 Q 61 109 84 104 L 83 124 Q 61 130 39 124 Z" fill="#B84B68"/>
        </g>
        <!-- Ice cubes floating in espresso -->
        <rect x="42" y="54" width="12" height="11" rx="2.5" fill="#FFFFFF" fill-opacity="0.72" stroke="#1F1F23" stroke-width="1.6" transform="rotate(-10 48 59)"/>
        <rect x="64" y="52" width="12" height="11" rx="2.5" fill="#FFFFFF" fill-opacity="0.72" stroke="#1F1F23" stroke-width="1.6" transform="rotate(14 70 57)"/>
        <rect x="52" y="68" width="11" height="10" rx="2.5" fill="#FFFFFF" fill-opacity="0.65" stroke="#1F1F23" stroke-width="1.5" transform="rotate(6 57 73)"/>
        <!-- Hand-drawn cup outline + dome lid -->
        <path d="M 30 36 L 92 36 L 83 124 Q 61 130 39 124 Z" fill="none" stroke="#1F1F23" stroke-width="3.0"/>
        <path d="M 27 36 C 32 20 90 20 95 36 Z" fill="#F7F3EA" fill-opacity="0.75" stroke="#1F1F23" stroke-width="2.7"/>
        <ellipse cx="61" cy="36" rx="34" ry="4.6" fill="#F7F3EA" stroke="#1F1F23" stroke-width="2.5"/>
        <!-- Little berry & honey dots on cup -->
        <circle cx="48" cy="115" r="3.2" fill="#8C2845" stroke="#1F1F23" stroke-width="1.3"/>
        <circle cx="57" cy="118" r="2.8" fill="#8C2845" stroke="#1F1F23" stroke-width="1.3"/>
        <circle cx="71" cy="115" r="3.0" fill="#8C2845" stroke="#1F1F23" stroke-width="1.3"/>
        <!-- Animated little sparkle next to cup -->
        <g transform="translate(106, 46)">
          <path d="M 0 -7 L 1.7 -1.7 L 7 0 L 1.7 1.7 L 0 7 L -1.7 1.7 L -7 0 L -1.7 -1.7 Z" fill="#F3E6A2" stroke="#1F1F23" stroke-width="1.3">
            <animateTransform attributeName="transform" type="rotate" values="-12; 14; -12" dur="4.4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.65;1;0.65" dur="3.6s" repeatCount="indefinite"/>
          </path>
        </g>
        <text x="61" y="146" text-anchor="middle" fill="#4E4A43" font-family="'Comic Sans MS', 'Chalkboard SE', 'Bradley Hand', 'Segoe Print', cursive" font-size="11.5" font-weight="700" transform="rotate(-2 61 146)">fore · iced</text>
      </g>
</svg>