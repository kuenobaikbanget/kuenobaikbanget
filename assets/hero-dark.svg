<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-labelledby="nhd_title nhd_desc">
  <title id="nhd_title">Akbar Dwi Maulana | lazy as a cat, slow as a sloth</title>
  <desc id="nhd_desc">Casual grid notebook hero banner with a Looren-style monochrome hoodie portrait sticker doing a thumbs-up.</desc>
  <defs>
    <pattern id="nhd_grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 H 0 V 22" fill="none" stroke="#24242D" stroke-width="0.9"/>
    </pattern>
    <clipPath id="nhd_pageClip">
      <rect x="2" y="2" width="870" height="260" rx="14"/>
    </clipPath>
  </defs>

  <rect x="6" y="6" width="870" height="260" rx="14" fill="#0A0B0E"/>
  <rect x="2" y="2" width="870" height="260" rx="14" fill="#17171B"/>
  <rect x="2" y="2" width="870" height="260" rx="14" fill="url(#nhd_grid)"/>

  <g clip-path="url(#nhd_pageClip)">
    <line x1="40" y1="2" x2="40" y2="262" stroke="#5C3A3C" stroke-width="1.5"/>
    <circle cx="18" cy="36" r="6" fill="#0D1117" stroke="#474754" stroke-width="1.8"/><circle cx="18" cy="76" r="6" fill="#0D1117" stroke="#474754" stroke-width="1.8"/><circle cx="18" cy="116" r="6" fill="#0D1117" stroke="#474754" stroke-width="1.8"/><circle cx="18" cy="156" r="6" fill="#0D1117" stroke="#474754" stroke-width="1.8"/><circle cx="18" cy="196" r="6" fill="#0D1117" stroke="#474754" stroke-width="1.8"/><circle cx="18" cy="236" r="6" fill="#0D1117" stroke="#474754" stroke-width="1.8"/>

    <rect x="64" y="42" width="156" height="23" rx="5" fill="#242834" stroke="#455066" stroke-width="1.5"/>
    <text x="142" y="57.5" text-anchor="middle" fill="#CFE0F2" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="10.8" font-weight="700" letter-spacing="1.2">NOTEBOOK · YEAR 3</text>

    <text x="64" y="114" fill="#F7F3EA" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.6">Akbar Dwi Maulana</text>

    <g transform="rotate(-0.9 230 148)">
      <rect x="60" y="134" width="350" height="29" rx="5" fill="#38321B"/>
    </g>
    <text x="68" y="154" fill="#F3E6A2" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="18.2" font-weight="700">lazy as a cat, slow as a sloth</text>

    <path d="M 64 184 Q 78 179 92 184 T 120 184 T 148 184 T 176 184 T 204 184 T 232 184 T 260 184 T 288 184"
          fill="none" stroke="#5C3A3C" stroke-width="2" stroke-linecap="round"/>

    <text x="64" y="216" fill="#C0BAB0" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="600">certified larper</text>

    <path d="M 232 212 C 314 224 420 208 492 178" fill="none" stroke="#CFE0F2" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 483 175 L 494 177 L 489 187" fill="none" stroke="#CFE0F2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Animated floating hand-drawn stars & sketchbook doodles -->
    <!-- 1. Big butter star top-right (drifts + gently spins + pulses) -->
    <g transform="translate(820, 50)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="4.2s" repeatCount="indefinite"/>
        <path d="M 0 -11 L 2.6 -2.6 L 11 0 L 2.6 2.6 L 0 11 L -2.6 2.6 L -11 0 L -2.6 -2.6 Z" fill="#F3E6A2" stroke="#1F1F23" stroke-width="1.5" stroke-linejoin="round">
          <animateTransform attributeName="transform" type="rotate" values="-8; 10; -8" dur="5.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.72;1;0.72" dur="4.2s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- 2. Blush pink star upper-center -->
    <g transform="translate(524, 54)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,5; 0,0" dur="4.8s" repeatCount="indefinite"/>
        <path d="M 0 -8.5 L 2 -2 L 8.5 0 L 2 2 L 0 8.5 L -2 2 L -8.5 0 L -2 -2 Z" fill="#EED2DF" stroke="#1F1F23" stroke-width="1.4" stroke-linejoin="round">
          <animateTransform attributeName="transform" type="rotate" values="12; -12; 12" dur="5.8s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- 3. Mist-blue star lower-right -->
    <g transform="translate(812, 206)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="5.4s" repeatCount="indefinite"/>
        <path d="M 0 -7.5 L 1.8 -1.8 L 7.5 0 L 1.8 1.8 L 0 7.5 L -1.8 1.8 L -7.5 0 L -1.8 -1.8 Z" fill="#CFE0F2" stroke="#1F1F23" stroke-width="1.3" stroke-linejoin="round">
          <animateTransform attributeName="transform" type="rotate" values="-14; 14; -14" dur="6.2s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- 4. Drifting tiny hand-drawn cloud -->
    <g transform="translate(418, 48)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 14,0; 0,0" dur="9.5s" repeatCount="indefinite"/>
        <path d="M 4 14 C -2 14 -2 6 5 6 C 7 0 18 -1 22 4 C 28 3 32 10 26 14 Z" fill="#CFE0F2" stroke="#1F1F23" stroke-width="1.7" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 5. Floating pastel doodle dots & mini diamond -->
    <circle cx="536" cy="212" r="4" fill="#D3E3D3" stroke="#1F1F23" stroke-width="1.4">
      <animate attributeName="cy" values="212;204;212" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="772" cy="36" r="3.4" fill="#DDD2EA" stroke="#1F1F23" stroke-width="1.3">
      <animate attributeName="cy" values="36;43;36" dur="5.1s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(480, 120)">
      <path d="M 0 -5 L 5 0 L 0 5 L -5 0 Z" fill="#F3E6A2" stroke="#1F1F23" stroke-width="1.3" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="3.9s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Gentle floating Looren thumbs-up portrait -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="5.0s" repeatCount="indefinite"/>
      <g transform="translate(566, 36) rotate(-2.5) scale(1.24)">
      
        <g transform="translate(3,4)" fill="rgba(0,0,0,0.36)" stroke="rgba(0,0,0,0.36)" stroke-width="15" stroke-linejoin="round" stroke-linecap="round">
          <path d="M 53 58 C 46 39 58 20 82 19 C 102 18 119 31 117 55"/>
          <ellipse cx="84" cy="58" rx="30" ry="27"/>
          <path d="M 55 80 C 24 83 19 124 34 140 C 41 148 53 146 58 136 L 63 123 L 63 142 L 106 142 L 106 123 C 115 128 124 130 132 128 L 132 95 C 126 84 120 80 112 80 Z"/>
          <path d="M 129 97 L 132 76 C 132 67 144 67 145 77 L 144 92 C 155 92 157 100 153 105 C 157 110 155 117 148 119 C 152 124 146 131 136 130 L 123 126 Z"/>
        </g>
      
        <g transform="translate(0,0)" fill="#F3E6A2" stroke="#F3E6A2" stroke-width="15" stroke-linejoin="round" stroke-linecap="round">
          <path d="M 53 58 C 46 39 58 20 82 19 C 102 18 119 31 117 55"/>
          <ellipse cx="84" cy="58" rx="30" ry="27"/>
          <path d="M 55 80 C 24 83 19 124 34 140 C 41 148 53 146 58 136 L 63 123 L 63 142 L 106 142 L 106 123 C 115 128 124 130 132 128 L 132 95 C 126 84 120 80 112 80 Z"/>
          <path d="M 129 97 L 132 76 C 132 67 144 67 145 77 L 144 92 C 155 92 157 100 153 105 C 157 110 155 117 148 119 C 152 124 146 131 136 130 L 123 126 Z"/>
        </g>
      <g stroke-linecap="round" stroke-linejoin="round">
        <!-- Oversized hoodie body & left relaxed sleeve -->
        <path d="M 55 80 C 24 83 19 124 34 140 C 41 148 53 146 58 136 L 63 123 L 63 142 L 106 142 L 106 123 C 115 128 124 130 132 128 L 132 95 C 126 84 120 80 112 80 Z" fill="#F3E6A2" stroke="#1F1F23" stroke-width="3.6"/>
        <path d="M 48 111 C 46 119 48 126 55 129" fill="none" stroke="#1F1F23" stroke-width="2.6"/>

        <!-- Slouchy bunched hoodie collar & hood rim + two dangling drawstrings -->
        <path d="M 51 83 C 46 72 52 63 60 66 M 117 83 C 122 72 116 63 108 66" fill="#F3E6A2" stroke="#1F1F23" stroke-width="3.2"/>
        <path d="M 57 82 C 62 98 106 98 111 82" fill="#F3E6A2" stroke="#1F1F23" stroke-width="3.4"/>
        <path d="M 66 85 C 72 95 96 95 102 85" fill="none" stroke="#1F1F23" stroke-width="2.4"/>
        <!-- Hoodie drawstrings -->
        <path d="M 76 93 Q 74 107 76 118" fill="none" stroke="#1F1F23" stroke-width="2.6"/>
        <circle cx="76" cy="120" r="2.2" fill="#1F1F23"/>
        <path d="M 92 93 Q 94 109 92 122" fill="none" stroke="#1F1F23" stroke-width="2.6"/>
        <circle cx="92" cy="124" r="2.2" fill="#1F1F23"/>

        <!-- Rounded C-shaped ears -->
        <path d="M 55 56 C 47 56 47 68 56 68" fill="#F3E6A2" stroke="#1F1F23" stroke-width="3.4"/>
        <path d="M 113 56 C 121 56 121 68 112 68" fill="#F3E6A2" stroke="#1F1F23" stroke-width="3.4"/>

        <!-- Head shape -->
        <ellipse cx="84" cy="58" rx="29" ry="26" fill="#F3E6A2" stroke="#1F1F23" stroke-width="3.6"/>

        <!-- Hair swept cleanly to the right side (parted left -> flowing right) -->
        <path d="M 53 57 C 48 36 62 19 84 19 C 105 19 119 33 116 56 C 110 46 98 42 84 44 C 72 46 62 49 53 57 Z"
              fill="#F3E6A2" stroke="#1F1F23" stroke-width="3.6"/>
        <!-- Soft sweeping right-flowing bangs & flip tip -->
        <path d="M 64 31 C 80 30 98 35 108 49" fill="none" stroke="#1F1F23" stroke-width="3.1"/>
        <path d="M 60 39 C 72 38 84 41 93 48" fill="none" stroke="#1F1F23" stroke-width="2.7"/>
        <path d="M 111 33 Q 120 31 122 39" fill="none" stroke="#1F1F23" stroke-width="2.3"/>

        <!-- Simple Looren dot eyes + tiny nose + gentle small smile (no glasses) -->
        <ellipse cx="75" cy="60" rx="2.3" ry="3.3" fill="#1F1F23"/>
        <ellipse cx="93" cy="60" rx="2.3" ry="3.3" fill="#1F1F23"/>
        <path d="M 85 63 L 86.5 66.5" fill="none" stroke="#1F1F23" stroke-width="2.1"/>
        <path d="M 78 72 Q 83 76 89 72" fill="none" stroke="#1F1F23" stroke-width="2.4"/>

        <!-- Left hand resting casually -->
        <path d="M 35 139 C 35 130 49 128 54 137" fill="#F3E6A2" stroke="#1F1F23" stroke-width="3.2"/>

        <!-- Right sleeve cuff + clear Thumbs-Up hand -->
        <path d="M 115 99 C 113 114 117 125 125 127" fill="none" stroke="#1F1F23" stroke-width="3.1"/>
        <path d="M 129 97 L 132 76 C 132 67 144 67 145 77 L 144 92 C 155 92 157 100 153 105 C 157 110 155 117 148 119 C 152 124 146 131 136 130 L 123 126 Z" fill="#F3E6A2" stroke="#1F1F23" stroke-width="3.5"/>
        <!-- Curled fist finger lines -->
        <path d="M 142 103 L 152 104 M 142 111 L 152 112 M 140 119 L 148 120" fill="none" stroke="#1F1F23" stroke-width="2.4"/>
      </g>
    </g>
    </g>
  </g>

  <rect x="2" y="2" width="870" height="260" rx="14" fill="none" stroke="#3A3A44" stroke-width="1.7"/>
</svg>